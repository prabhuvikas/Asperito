name: Asperito Website + Screenshots

on:
  push:
    branches:
      - feat/ios-mvp
    paths:
      - '.github/workflows/asperito-site.yml'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: asperito-site
  cancel-in-progress: false

jobs:
  publish:
    name: Sync screenshots and deploy motion website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Asperito feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ios-mvp
          persist-credentials: true

      - name: Retrieve verified 17-screen simulator artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots
          # Verified successful capture (all 17 frames, including Custom Grid).
          mkdir -p /tmp/asperito-capture
          gh run download 42395032783 \
            --repo "$GITHUB_REPOSITORY" \
            --name asperito-all-17-screens \
            --dir /tmp/asperito-capture
          cp -f /tmp/asperito-capture/*.png docs/screenshots/
          cp -f FrameGuide/Assets.xcassets/DirectorLogo.imageset/director.jpg docs/director.jpg
          test "$(find docs/screenshots -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = "17"
          file docs/screenshots/overlay-custom.png
          file docs/screenshots/onboarding.png
          test "$(stat -c%s docs/screenshots/overlay-custom.png)" -gt 120000
          ls -lh docs/screenshots/

      - name: Commit actual screenshots to GitHub documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ docs/director.jpg
          if git diff --cached --quiet; then
            echo "Screenshot files already current."
          else
            git commit -m "docs: embed 17 verified iOS Simulator screenshots"
            git push origin HEAD:feat/ios-mvp
          fi

      - name: Check screenshot gallery and website code
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/app.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          root=Path("docs")
          assert len(list((root/"screenshots").glob("*.png")))==17, "Expected 17 screenshot PNGs"
          class Page(HTMLParser):
              def __init__(self): super().__init__(); self.images=[]; self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="img": self.images.append(a.get("src",""))
                  if tag=="script": self.links.append(a.get("src",""))
                  if tag=="link" and a.get("rel")=="stylesheet" and a.get("href","").startswith("./"): self.links.append(a["href"])
          p=Page(); p.feed((root/"index.html").read_text())
          for src in p.images+p.links:
              if src.startswith("./"): assert (root/src[2:]).exists(), f"Missing {src}"
          assert len(p.images)>=10
          print(f"Verified {len(p.images)} website images, all scripts and CSS, and 17 source screenshots")
          PY

      - name: Render desktop and iPhone website previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site-preview
          npm install --prefix /tmp/asperito-browser --no-save playwright@1.58.2
          /tmp/asperito-browser/node_modules/.bin/playwright install chromium
          python3 -m http.server 8765 --directory docs > /tmp/asperito-http.log 2>&1 &
          echo $! > /tmp/asperito-http.pid
          node <<'JS'
          const {chromium}=require("/tmp/asperito-browser/node_modules/playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const base="http://127.0.0.1:8765/";
            for (const [name,width,height,isMobile] of [["desktop",1440,900,false],["iphone",390,844,true]]) {
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,isMobile,hasTouch:isMobile,reducedMotion:"reduce"});
              await page.goto(base,{waitUntil:"networkidle"});
              await page.evaluate(async () => { document.querySelectorAll("img").forEach(img=>{img.loading="eager"}); await Promise.all([...document.images].map(img=>img.decode().catch(()=>{}))); });
              const expected=await page.locator(".guide-option").count();
              if(expected!==12)throw Error("Expected 12 interactive composition guides; found "+expected);
              await page.locator('[data-guide="goldenSpiral"]').click();
              await page.waitForFunction(() => document.querySelector("#guide-image")?.getAttribute("src")?.includes("goldenSpiral"),{timeout:5000});
              const src=await page.locator("#guide-image").getAttribute("src");
              if(!src.includes("goldenSpiral"))throw Error("Guide button did not change image");
              await page.locator('[data-guide="thirds"]').click();
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.screenshot({path:"site-preview/"+name+".png",fullPage:true,animations:"disabled"});
              await page.close();
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Upload website preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asperito-site-desktop-mobile-preview
          path: site-preview/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload responsive website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report publishing result
        if: always()
        run: |
          {
            echo "### Asperito immersive website"
            echo "- Source: docs/index.html, docs/style.css, docs/app.js"
            echo "- Screenshots: 17 real Simulator captures (synthetic landscape under live SwiftUI guides)"
            echo "- GitHub Pages: https://prabhuvikas.github.io/Asperito/"
            echo "- If Pages configuration fails, enable **Settings → Pages → Build and deployment → GitHub Actions** and rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
