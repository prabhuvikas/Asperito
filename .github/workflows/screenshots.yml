name: iOS Actual Screenshots

on:
  pull_request:
    paths:
      - 'FrameGuide/**'
      - 'FrameGuide.xcodeproj/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-capture:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Select iPhone Simulator and build
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import sys,json
          data=json.load(sys.stdin)["devices"]
          phones=[x for devices in data.values() for x in devices
                  if x.get("isAvailable") and x["name"].startswith("iPhone")]
          if not phones: raise SystemExit("No available iPhone Simulator")
          print(phones[0]["udid"])
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project FrameGuide.xcodeproj -scheme FrameGuide \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1

      - name: Capture running app views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          UDID="$SIMULATOR_UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$PWD/DerivedData/Build/Products/Debug-iphonesimulator/FrameGuide.app"
          BUNDLE_ID="com.frameguide.ios"
          python3 - <<'PY'
          import subprocess, time, os, pathlib, sys
          udid = os.environ["SIMULATOR_UDID"]
          bundle = "com.frameguide.ios"
          for screen in ("onboarding","camera","picker","tutorial","settings",
               "overlay-thirds","overlay-goldenGrid","overlay-goldenSpiral",
               "overlay-center","overlay-diagonal","overlay-square",
               "overlay-horizon","overlay-eyeLine","overlay-safeArea",
               "overlay-perspective","overlay-cinematic","overlay-custom",
               "overlay-leadingLines","overlay-reflection","overlay-goldenTriangle",
               "overlay-frameWithinFrame","overlay-negativeSpace","overlay-sCurve"):
              target=pathlib.Path("screenshots")/f"{screen}.png"
              captured=False
              for attempt in range(1,5):
                  print(f"Capture {screen}: attempt {attempt}",flush=True)
                  try:
                      subprocess.run(["xcrun","simctl","terminate",udid,bundle],capture_output=True,timeout=30)
                  except subprocess.TimeoutExpired:
                      print("Simulator termination timed out",flush=True)
                  try:
                      result=subprocess.run(["xcrun","simctl","launch",udid,bundle,
                                             f"--asperito-screen={screen}"],
                                            capture_output=True,text=True,timeout=60)
                      print("Launch",result.returncode,result.stdout,result.stderr,flush=True)
                      if result.returncode:
                          time.sleep(2)
                          continue
                      time.sleep(3 + attempt * 2)
                      shot=subprocess.run(["xcrun","simctl","io",udid,"screenshot",str(target)],
                                          capture_output=True,text=True,timeout=60)
                      if shot.returncode:
                          print("Screenshot failure",shot.stderr,flush=True)
                          continue
                      size=target.stat().st_size
                      print("Bytes",size,flush=True)
                      if size >= 120000:
                          captured=True
                          break
                  except subprocess.TimeoutExpired:
                      print("Timed out; retrying",flush=True)
                  time.sleep(2)
              if not captured:
                  raise SystemExit(f"Failed to capture readable screen: {screen}")
          PY
          file screenshots/*.png
          ls -lh screenshots/
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path("screenshots").glob("*.png")):
              size=path.stat().st_size
              print(path.name, size)
              if size < 120000:
                  raise SystemExit(f"Screenshot looks incomplete/blank: {path.name} ({size} bytes)")
          PY
          test "$(find screenshots -name '*.png' | wc -l | tr -d ' ')" = "23"

      - name: Upload unmodified screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asperito-all-23-screens
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: asperito-simulator-diagnostics
          path: simulator-build.log
          if-no-files-found: ignore
