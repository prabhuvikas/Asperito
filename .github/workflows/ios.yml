name: iOS PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build-and-tests:
    name: Simulator build & unit tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Show Xcode and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Validate project and privacy plist
        run: |
          plutil -lint FrameGuide.xcodeproj/project.pbxproj
          plutil -lint FrameGuide/PrivacyInfo.xcprivacy

      - name: Build app for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FrameGuide.xcodeproj \
            -scheme FrameGuide \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-build.log

      - name: Pick an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import sys, json
          devices = json.load(sys.stdin)["devices"]
          choices = [d for group in devices.values() for d in group
                     if d.get("isAvailable", False) and d["name"].startswith("iPhone")]
          if not choices:
              raise SystemExit("No available iPhone simulator found")
          print(choices[0]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected iPhone simulator: $UDID"

      - name: Run automated XCTest suite with coverage
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project FrameGuide.xcodeproj \
            -scheme FrameGuide \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-test.log

      - name: Generate coverage report and enforce core threshold
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("coverage.json").read_text())
          targets=doc.get("targets",[])
          all_files=[]
          for target in targets:
              all_files.extend(target.get("files",[]))
          expected=["OverlayGeometry.swift","OverlayType.swift","OverlayLesson.swift"]
          values=[]
          for name in expected:
              matches=[f for f in all_files
                       if name in str(f.get("path","")) or name in str(f.get("name",""))]
              if not matches:
                  raise SystemExit(f"Missing xccov data for {name}; cannot pass coverage gate")
              coverage=float(matches[0]["lineCoverage"])
              values.append((name,coverage))
              print(f"{name}: {coverage:.1%}")
          minimum=0.40
          failures=[name for name,value in values if value < minimum]
          summary=Path("coverage-summary.md")
          summary.write_text("### Core code coverage\n" +
              "\n".join(f"- {name}: {v:.1%}" for name,v in values) +
              f"\n- Minimum required per file: {minimum:.0%}\n")
          if failures:
              raise SystemExit("Coverage below minimum: "+", ".join(failures))
          PY
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### FrameGuide iOS PR checks"
            echo "- Build: iOS Simulator"
            echo "- Tests: unit suite + FrameGuideUITests (navigation, privacy, composition and settings)"
            echo "- Coverage: core code minimum 40% per file (see coverage.json + TestResults.xcresult)"
            echo "- Camera hardware, photo saving and real-device orientation are not covered by simulator tests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Xcode logs and test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frameguide-ios-ci-${{ github.run_id }}
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
            TestResults.xcresult/
            coverage.json
            coverage-summary.md
          if-no-files-found: warn
          retention-days: 14
